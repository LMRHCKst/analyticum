# Монстры. Наследование через функцию + карринг:
# base(hp) возвращает функцию (dmg) -> объект.
# Конкретный монстр — это base(hp)(dmg) + переопределения.
let base = (hp) -> (dmg) -> {
  hp: hp;
  damage: dmg;
  defense: 0;
  xp: max(1, hp / 3);
  ai: patrol;
  aggro_range: 7;
  loot: [coin x2];
  glyph: "o";
};

let tough = base(30);

monster rat = base(4)(1) + {
  name: "крыса";
  glyph: "r";
  ai: aggressive;
  aggro_range: 5;
  loot: [coin];
};

monster orc = tough(5) + {
  name: "орк";
  glyph: "o";
  ai: aggressive;
  loot: [potion, coin x3];
};

monster skeleton = base(18)(4) + {
  name: "скелет";
  glyph: "s";
  ai: patrol;
  defense: 1;
  loot: [coin x2, potion];
};

monster ghost = base(12)(3) + {
  name: "призрак";
  glyph: "g";
  ai: coward;
  flee_at: 0.5;
  loot: [scroll];
};

monster boss_butcher = base(60)(6) + {
  name: "Мясник";
  glyph: "B";
  ai: aggressive;
  boss: true;
  loot: [potion x3, coin x10];
};

monster boss_whisper = base(45)(4) + {
  name: "Шёпот";
  glyph: "W";
  ai: patrol;
  boss: true;
  loot: [scroll x2, potion];
};

monster boss_architect = base(55)(5) + {
  name: "Архитектор";
  glyph: "A";
  ai: aggressive;
  boss: true;
  loot: [amulet, coin x5];
};
